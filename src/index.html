<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Off 2026</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #101418;
      }
      #canvas-main {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #fps {
        position: fixed;
        top: 10px;
        right: 12px;
        pointer-events: none;
        color: #e8eef4;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7);
        font: 14px/1.4 ui-monospace, monospace;
      }
      #hud {
        position: fixed;
        top: 10px;
        left: 12px;
        pointer-events: none;
        color: #e8eef4;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7);
        font: 14px/1.4 ui-monospace, monospace;
        display: grid;
        gap: 2px;
      }
      #hud-time {
        font-size: 24px;
        letter-spacing: 0.5px;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas-main"></canvas>
    <div id="hud">
      <div id="hud-lap"></div>
      <div id="hud-time"></div>
    </div>
    <div id="fps"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
